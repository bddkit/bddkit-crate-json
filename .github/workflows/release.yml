name: Release

# Every push to `main` runs release-plz twice:
#   * `release`    - if the version in Cargo.toml is not on crates.io yet, it
#                    publishes it, tags `v<version>` and creates the GitHub Release.
#                    Normally a no-op; it only fires after the release PR is merged.
#   * `release-pr` - opens or updates the "chore: release" PR that carries the
#                    version bump and the changelog. Nobody edits Cargo.toml by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: publish & tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write # crates.io trusted publishing (OIDC, no registry token)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release-pr:
    name: release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
